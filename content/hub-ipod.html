  <h2 id="hub-guide">iPod 식별자 읽는 법</h2>
  <p>iPod 식별자는 <code class="mono">iPod9,1</code>처럼 <em>iPod + 숫자 + 쉼표 + 숫자</em> 형식이며,
     여기에 실린 기종은 iPod touch 계열입니다. 가장 마지막 식별자인 <code class="mono">iPod9,1</code>은 7세대 iPod touch입니다.</p>
  <p>새 기종이 나오지 않는 제품군이라 목록이 짧습니다. 오래된 기기의 크래시 로그나 기기 관리 목록에서
     iPod 식별자가 보이면 아래 목록에서 세대를 확인하세요.</p>
</section>
