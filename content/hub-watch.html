  <h2 id="hub-guide">Apple Watch 식별자 읽는 법</h2>
  <p>Apple Watch 식별자는 <code class="mono">Watch7,1</code>처럼 <em>Watch + 숫자 + 쉼표 + 숫자</em> 형식입니다.
     같은 시리즈라도 케이스 크기(예: 41mm·45mm)와 GPS 전용·GPS + Cellular 여부에 따라 식별자가 다릅니다.
     <code class="mono">Watch7,1</code>은 Series 9 41mm GPS, <code class="mono">Watch7,3</code>은 Series 9 41mm GPS + Cellular입니다.</p>
  <p>쉼표 앞 숫자가 같은 식별자를 아래에 계열별로 묶었습니다. 한 계열에 서로 다른 시리즈가 함께 들어 있을 수 있습니다.</p>
</section>
