  <h2 id="hub-guide">iPhone 식별자 읽는 법</h2>
  <p>iPhone 식별자는 <code class="mono">iPhone15,2</code>처럼 <em>iPhone + 숫자 + 쉼표 + 숫자</em> 형식입니다.
     쉼표 앞 숫자는 판매명의 숫자와 다릅니다. <code class="mono">iPhone15,2</code>는 iPhone 15가 아니라
     iPhone 14 Pro입니다.</p>
  <p>쉼표 앞 숫자가 같은 식별자는 아래처럼 한 계열로 묶었습니다. 같은 기종명에 식별자가 두 개 이상이면
     지역별 모델이 따로 등록된 경우입니다. 설정 앱의 <code class="mono">A</code>로 시작하는 모델 번호는 다른 체계이므로
     <a href="../guide/iphone-model-check.html">모델 번호와 식별자의 차이</a>를 참고하세요.</p>
</section>
