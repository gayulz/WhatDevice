<section class="content" aria-labelledby="hub-guide">
  <h2 id="hub-guide">iPad 식별자 읽는 법</h2>
  <p>iPad 식별자는 <code class="mono">iPad14,5</code>처럼 <em>iPad + 숫자 + 쉼표 + 숫자</em> 형식입니다.
     같은 세대라도 화면 크기와 통신 방식에 따라 식별자가 나뉩니다. 예를 들어
     <code class="mono">iPad14,5</code>는 iPad Pro 12.9 inch 6세대 Wi-Fi 모델,
     <code class="mono">iPad14,6</code>은 같은 기종의 Wi-Fi + Cellular 모델입니다.</p>
  <p>로그에서 iPad 식별자를 볼 때는 쉼표 뒤 숫자까지 정확히 대조해야 크기와 셀룰러 여부를 구분할 수 있습니다.
     쉼표 앞 숫자가 같은 식별자를 아래에 계열별로 묶었습니다.</p>
</section>
