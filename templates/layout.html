<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}">
    <link rel="canonical" href="{{CANONICAL}}">

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="WhatDevice">
    <meta property="og:title" content="{{TITLE}}">
    <meta property="og:description" content="{{DESCRIPTION}}">
    <meta property="og:url" content="{{CANONICAL}}">
    <meta property="og:locale" content="ko_KR">
    <meta name="twitter:card" content="summary">

    <link rel="icon" href="{{BASE}}favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="{{BASE}}style.css">

    <!-- Google Search Console 소유권 확인 메타. -->
    <meta name="google-site-verification" content="Lj9WIn4tyx-Fwr1HPd0amByYMKOR6DjXiv5mlrODgx4">

    <!-- Google Tag Manager -->
    <script>(function (w, d, s, l, i) {
        w[l] = w[l] || [];
        w[l].push({
            'gtm.start':
                new Date().getTime(), event: 'gtm.js'
        });
        var f = d.getElementsByTagName(s)[0],
            j = d.createElement(s), dl = l != 'dataLayer' ? '&l=' + l : '';
        j.async = true;
        j.src =
            'https://www.googletagmanager.com/gtm.js?id=' + i + dl;
        f.parentNode.insertBefore(j, f);
    })(window, document, 'script', 'dataLayer', 'GTM-5N22XGPL');</script>
    <!-- End Google Tag Manager -->

    <!-- 카카오 애드핏 SDK (페이지당 1회 로드, 모든 .kakao_ad_area 자동 스캔) -->
    <script type="text/javascript" src="//t1.kakaocdn.net/kas/static/ba.min.js" async></script>

    <!-- 쿠팡 파트너스 SDK. 본문 안의 인라인 스크립트가 삽입 위치에서 즉시 실행되므로
         async/defer 를 붙이면 안 된다(PartnersCoupang 이 미정의 상태가 됨). -->
    <script src="https://ads-partners.coupang.com/g.js"></script>

    <!-- 다크모드 깜빡임 방지: 렌더 전에 테마 클래스를 미리 적용 -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme');
                var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (t === 'dark' || (!t && prefersDark)) {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) { /* localStorage 사용 불가 환경 무시 */
            }
        })();
    </script>
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript>
    <iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5N22XGPL"
            height="0" width="0" style="display:none;visibility:hidden"></iframe>
</noscript>
<!-- End Google Tag Manager (noscript) -->
<header class="site-header">
    <div class="container header-inner">
        <a class="brand" href="{{BASE}}index.html">What<span>Device</span></a>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="다크/라이트 모드 전환">
            <span class="theme-icon" aria-hidden="true"></span>
        </button>
    </div>
</header>

<main class="container">
    {{MAIN}}
</main>

<footer class="site-footer">
    <div class="container">
        <nav class="footer-nav footer-categories" aria-label="기기 카테고리">
            {{CATEGORY_NAV}}
        </nav>
        <nav class="footer-nav" aria-label="사이트 정책">
            <a href="{{BASE}}guide/identifier-basics.html">가이드</a>
            <a href="{{BASE}}policy/terms.html">이용약관</a>
            <a href="{{BASE}}policy/privacy.html">개인정보처리방침</a>
            <a href="{{BASE}}policy/contact.html">문의</a>
        </nav>
        <p class="disclaimer">{{DISCLAIMER}}</p>
        <p class="disclaimer">이 사이트는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>
    </div>
</footer>

<script src="{{BASE}}theme.js"></script>
{{SCRIPTS}}
</body>
</html>
