# GitHub Pages 자동 배포 워크플로
# main 브랜치 push 시 BuildSite를 실행하여 dist/를 생성하고 Pages에 배포한다.
# 데이터 자동 동기화(adamawolf gist 재다운로드)가 필요하면 Sync 단계의 주석을 해제하면 된다.

name: Build & Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  # 데이터 주기 동기화 예시 (매주 월요일 03:00 UTC)
  # schedule:
  #   - cron: '0 3 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # (선택) adamawolf gist 원본을 최신으로 동기화하려면 주석 해제.
      # 주의: 빌드만 최신 데이터로 되고 data/devices.txt 커밋은 갱신되지 않아
      # 저장소와 배포본이 어긋난다. 상시 켤 값이 아니라 schedule 과 세트로 쓸 것.
      # - name: Sync devices.txt (optional)
      #   run: curl -sSL https://gist.githubusercontent.com/adamawolf/3048717/raw/ -o data/devices.txt

      - name: Build site
        run: |
          gradle wrapper --gradle-version 8.10.2
          ./gradlew run --no-daemon

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
